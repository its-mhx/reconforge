
name: ReconForge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  passive-recon:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Passive Certificate Discovery
        run: |
          mkdir -p output
          touch output/passive_subdomains.txt

          python - <<'PY'
          import json
          import time
          import urllib.request
          import urllib.parse
          import urllib.error
          from pathlib import Path

          watchlist = Path("watchlist.txt")
          output = Path("output/passive_subdomains.txt")

          if not watchlist.exists():
              raise SystemExit("[ERROR] watchlist.txt is missing")

          targets = [
              line.strip().lower().rstrip(".")
              for line in watchlist.read_text().splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          ]

          if not targets:
              raise SystemExit("[ERROR] watchlist.txt is empty")

          results = set()
          failed = []

          for domain in targets:
              print(f"\n[+] Querying crt.sh for {domain}")

              params = urllib.parse.urlencode({
                  "q": domain,
                  "output": "json"
              })

              url = f"https://crt.sh/?{params}"
              data = None

              for attempt in range(1, 4):
                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "ReconForge-PassiveResearch/1.0"
                      }
                  )

                  try:
                      with urllib.request.urlopen(
                          request, timeout=45
                      ) as response:
                          data = json.loads(response.read().decode("utf-8"))

                      if not isinstance(data, list):
                          raise ValueError("Unexpected JSON format")

                      break

                  except urllib.error.HTTPError as error:
                      if error.code == 404:
                          print(f"[-] No records for {domain}")
                          data = []
                          break

                      print(
                          f"[!] HTTP {error.code} for {domain} "
                          f"(attempt {attempt}/3)"
                      )

                  except (
                      urllib.error.URLError,
                      TimeoutError,
                      ValueError
                  ) as error:
                      print(
                          f"[!] Request/response error: {error} "
                          f"(attempt {attempt}/3)"
                      )

                  if attempt < 3:
                      time.sleep(2 ** attempt)

              if data is None:
                  failed.append(domain)
                  print(f"[!] Skipping {domain} after 3 attempts")
                  continue

              for item in data:
                  for name in item.get("name_value", "").splitlines():
                      name = name.strip().lower().lstrip("*.")

                      if (
                          name == domain
                          or name.endswith("." + domain)
                      ):
                          results.add(name)

              print(f"[+] Finished {domain}")
              time.sleep(1)

          output.write_text(
              "\n".join(sorted(results)) + ("\n" if results else "")
          )

          print("\n========== SUMMARY ==========")
          print(f"Targets processed: {len(targets)}")
          print(f"Unique names found: {len(results)}")
          print(f"Failed targets: {len(failed)}")
          print(f"Results saved to: {output}")

          if failed:
              print("[!] Retry these targets in a later run:")
              for domain in failed:
                  print(f" - {domain}")
          PY

      - name: Run Scope Validation
        run: |
          python scripts/scope_filter.py

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconforge-results
          path: output/
          if-no-files-found: error
          retention-days: 7
