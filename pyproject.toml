[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reconforge"
version = "0.1.0"
description = "All-in-one local recon & attack-surface monitoring platform for bug bounty (PrettyRecon-style, but local and free)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ReconForge"}]
dependencies = [
    "typer[all]>=0.12",
    "rich>=13.7",
    "requests>=2.31",
    "dnspython>=2.6",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "tldextract>=5.1",
]

[project.scripts]
reconforge = "reconforge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"reconforge.report" = ["templates/*.html"]
